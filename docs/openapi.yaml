openapi: 3.1.0
info:
  title: Smart Budgeting and Financial Goal Management API
  version: 1.0.0
  description: |-
    REST API for SmartBudget: accounts, income and expense tracking, budgets, savings goals, dashboard, reports and rule-based insights.

    **Authentication.** Session cookie. Call `GET /auth/csrf/` first, then send the `csrftoken` cookie value in an `X-CSRFToken` header on every POST, PATCH and DELETE.

    **Money** is always a decimal string such as `"125.50"`, never a floating-point number.

    **Errors** always look like `{"error": {"code": ..., "message": ..., "fields": {...}}}`.

    **Ownership.** Every endpoint only ever reads or changes the signed-in user's own records.
paths:
  /api/v1/admin/categories/:
    get:
      operationId: admin_categories_list
      description: GET/POST /admin/categories/ - the default categories every user
        sees.
      summary: List default categories
      tags:
      - Administrator
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategory'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
    post:
      operationId: admin_categories_create
      description: GET/POST /admin/categories/ - the default categories every user
        sees.
      summary: Create a default category
      tags:
      - Administrator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflicts with an existing record or a business rule.
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
  /api/v1/admin/categories/{id}/:
    delete:
      operationId: admin_categories_destroy
      description: DELETE /admin/categories/{id}/ - archive a default category.
      summary: Archive a default category
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Category id (UUID).
        required: true
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
      tags:
      - Administrator
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found. Other users' records also return 404, so ids cannot
            be probed.
  /api/v1/admin/stats/:
    get:
      operationId: admin_stats_retrieve
      description: Counts only. Never amounts or personal details.
      summary: System statistics
      tags:
      - Administrator
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStats'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
  /api/v1/admin/users/:
    get:
      operationId: admin_users_retrieve
      description: GET /admin/users/?q=&is_active= - accounts (paginated).
      summary: List accounts
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size (default 50, maximum 200).
      - in: query
        name: offset
        schema:
          type: integer
        description: How many records to skip.
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 100
      tags:
      - Administrator
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAdminUsers'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
  /api/v1/admin/users/{id}/:
    patch:
      operationId: admin_users_partial_update
      description: A deactivated user cannot sign in and loses any open session. Admins
        cannot deactivate themselves.
      summary: Activate or deactivate an account
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: User id (UUID).
        required: true
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
      tags:
      - Administrator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found. Other users' records also return 404, so ids cannot
            be probed.
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: GET /auth/csrf/ - the frontend calls this first so the browser
        gets a CSRF cookie.
      summary: Get a CSRF cookie
      tags:
      - Authentication
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfOk'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Starts a session. A wrong email and a wrong password give the same
        message.
      summary: Sign in
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many attempts. Try again later.
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: POST /auth/logout/ - end the session (CSRF is enforced by DRF for
        signed-in users).
      summary: Sign out
      tags:
      - Authentication
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: POST /auth/register/ - create an account and sign the user in.
      summary: Create an account and sign in
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too many attempts. Try again later.
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
  /api/v1/budgets/:
    get:
      operationId: budgets_list
      description: Each budget includes `used`, `remaining`, `used_pct` and `is_over`.
      summary: List budgets with usage
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      tags:
      - Budgets
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
    post:
      operationId: budgets_create
      description: One budget per category cannot overlap in time.
      summary: Create a budget
      tags:
      - Budgets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BudgetInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BudgetInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found. Other users' records also return 404, so ids cannot
            be probed.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflicts with an existing record or a business rule.
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
  /api/v1/budgets/{id}/:
    patch:
      operationId: budgets_partial_update
      summary: Edit a budget
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Budget id (UUID).
        required: true
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
      tags:
      - Budgets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBudgetUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBudgetUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBudgetUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found. Other users' records also return 404, so ids cannot
            be probed.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflicts with an existing record or a business rule.
    delete:
      operationId: budgets_destroy
      summary: Delete a budget
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Budget id (UUID).
        required: true
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
      tags:
      - Budgets
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found. Other users' records also return 404, so ids cannot
            be probed.
  /api/v1/categories/:
    get:
      operationId: categories_list
      description: Default categories plus the user's own (archived ones are hidden).
      summary: List categories
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - expense
          - income
        description: Only categories usable for this kind.
      tags:
      - Categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
    post:
      operationId: categories_create
      summary: Create a category
      tags:
      - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflicts with an existing record or a business rule.
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
  /api/v1/categories/{id}/:
    delete:
      operationId: categories_destroy
      description: Hides it from new records; old transactions keep it.
      summary: Archive a category
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Category id (UUID).
        required: true
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
      tags:
      - Categories
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found. Other users' records also return 404, so ids cannot
            be probed.
  /api/v1/dashboard/:
    get:
      operationId: dashboard_retrieve
      description: Defaults to the current month when no dates are sent.
      summary: Dashboard
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      tags:
      - Dashboard and reports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
  /api/v1/goals/:
    get:
      operationId: goals_list
      summary: List savings goals with progress
      parameters:
      - in: query
        name: status
        schema:
          enum:
          - active
          - paused
          - completed
          - archived
          type: string
          x-spec-enum-id: 6d61a9d98e292a15
          minLength: 1
        description: |-
          * `active` - active
          * `paused` - paused
          * `completed` - completed
          * `archived` - archived
      tags:
      - Savings goals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
    post:
      operationId: goals_create
      summary: Create a savings goal
      tags:
      - Savings goals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoalInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoalInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed. See `error.fields`.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
      parameters:
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
  /api/v1/goals/{id}/:
    get:
      operationId: goals_retrieve
      summary: Get one goal
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Goal id (UUID).
        required: true
      tags:
      - Savings goals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not signed in, missing or wrong CSRF token, or not allowed
            (wrong role).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found. Other users' records also return 404, so ids cannot
            be probed.
    patch:
      operationId: goals_partial_update
      description: Pause, resume, complete or archive. Not every change is allowed
        (409).
      summary: Change a goal's status
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Goal id (UUID).
        required: true
      - name: X-CSRFToken
        in: header
        required: true
        description: Value of the `csrftoken` cookie (get it from `GET /auth/csrf/`).
        schema:
          type: string
      tags:
      - Savings goals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGoalStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGoalStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGoalStatusRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
