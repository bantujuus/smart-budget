components:
  schemas:
    AdminCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        kind:
          enum:
          - income
          - expense
          - both
          type: string
          description: |-
            * `income` - Income
            * `expense` - Expense
            * `both` - Both
          x-spec-enum-id: 7ab3ff021e0a44e8
          readOnly: true
        is_archived:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_archived
      - kind
      - name
    AdminUser:
      type: object
      description: Account details an administrator may see. No password, and no financial
        data.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - is_active
      - last_login
      - role
    Budget:
      type: object
      description: Works with the objects from queries.budgets_with_usage (they carry
        the extra fields).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        period_type:
          enum:
          - weekly
          - monthly
          - custom
          type: string
          description: |-
            * `weekly` - Weekly
            * `monthly` - Monthly
            * `custom` - Custom
          x-spec-enum-id: 0797ab38ffaff5be
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
        limit_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        used:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        remaining:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        used_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        is_over:
          type: boolean
          readOnly: true
      required:
      - category
      - end_date
      - id
      - is_over
      - limit_amount
      - period_type
      - remaining
      - start_date
      - used
      - used_pct
    BudgetInputRequest:
      type: object
      properties:
        category_id:
          type: string
          minLength: 1
        period_type:
          type: string
          minLength: 1
        start_date:
          type: string
          minLength: 1
        end_date:
          type: string
          minLength: 1
        limit_amount: {}
      required:
      - category_id
      - end_date
      - limit_amount
      - period_type
      - start_date
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        kind:
          enum:
          - income
          - expense
          - both
          type: string
          description: |-
            * `income` - Income
            * `expense` - Expense
            * `both` - Both
          x-spec-enum-id: 7ab3ff021e0a44e8
          readOnly: true
        is_system:
          type: boolean
          readOnly: true
      required:
      - id
      - is_system
      - kind
      - name
    CategoryCounts:
      type: object
      properties:
        default:
          type: integer
        custom:
          type: integer
      required:
      - custom
      - default
    CategoryInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          minLength: 1
      required:
      - kind
      - name
    CategoryTotal:
      type: object
      properties:
        category_id:
          type: string
          format: uuid
        category:
          type: string
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        share_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,1})?$
      required:
      - category
      - category_id
      - share_pct
      - total
    Contribution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        contribution_date:
          type: string
          format: date
          readOnly: true
        note:
          type:
          - string
          - 'null'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - contribution_date
      - created_at
      - id
      - note
    ContributionInputRequest:
      type: object
      properties:
        amount: {}
        contribution_date:
          type: string
          minLength: 1
        note:
          type:
          - string
          - 'null'
      required:
      - amount
      - contribution_date
    ContributionResult:
      type: object
      properties:
        contribution:
          $ref: '#/components/schemas/Contribution'
        goal:
          $ref: '#/components/schemas/Goal'
      required:
      - contribution
      - goal
    CsrfOk:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    DashboardResponse:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        totals:
          $ref: '#/components/schemas/Totals'
        currency:
          type: string
        budgets:
          type: array
          items:
            $ref: '#/components/schemas/Budget'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/Goal'
        recent_transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
      required:
      - budgets
      - currency
      - goals
      - period
      - recent_transactions
      - totals
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable code, e.g. VALIDATION_ERROR, NOT_FOUND, CONFLICT.
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Per-field messages (validation errors only).
      required:
      - code
      - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    Goal:
      type: object
      description: Works with the objects from queries.goals_with_progress.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        target_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        target_date:
          type:
          - string
          - 'null'
          format: date
          readOnly: true
        status:
          enum:
          - active
          - paused
          - completed
          - archived
          type: string
          description: |-
            * `active` - Active
            * `paused` - Paused
            * `completed` - Completed
            * `archived` - Archived
          x-spec-enum-id: f842f116598c5808
          readOnly: true
        contributed:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        progress_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        bar_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        remaining_to_target:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bar_pct
      - contributed
      - created_at
      - id
      - name
      - progress_pct
      - remaining_to_target
      - status
      - target_amount
      - target_date
    GoalInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        target_amount: {}
        target_date:
          type:
          - string
          - 'null'
        initial_contribution:
          oneOf:
          - {}
          - type: 'null'
      required:
      - name
      - target_amount
    GoalStatusCounts:
      type: object
      properties:
        active:
          type: integer
        paused:
          type: integer
        completed:
          type: integer
        archived:
          type: integer
      required:
      - active
      - archived
      - completed
      - paused
    Insight:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        rule:
          type: string
          description: Which rule fired, e.g. BUDGET_OVER.
        severity:
          enum:
          - warning
          - info
          - positive
          type: string
          description: |-
            * `warning` - warning
            * `info` - info
            * `positive` - positive
          x-spec-enum-id: 6045728fb220bcbf
        title:
          type: string
        message:
          type: string
        explanation:
          type: string
          description: Why this tip was shown (the rule and its threshold).
        data:
          type: object
          additionalProperties: {}
          description: The numbers behind the tip.
      required:
      - data
      - explanation
      - message
      - period
      - rule
      - severity
      - title
    InsightsResponse:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
        message:
          type: string
        disclaimer:
          type: string
      required:
      - disclaimer
      - insights
      - message
      - period
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    PagedAdminUsers:
      type: object
      properties:
        count:
          type: integer
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
      required:
      - count
      - next
      - previous
      - results
    PagedTransactions:
      type: object
      properties:
        count:
          type: integer
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
      required:
      - count
      - next
      - previous
      - results
    PatchedAdminUserUpdateRequest:
      type: object
      properties:
        is_active:
          type: boolean
    PatchedBudgetUpdateRequest:
      type: object
      properties:
        period_type:
          type: string
          minLength: 1
        start_date:
          type: string
          minLength: 1
        end_date:
          type: string
          minLength: 1
        limit_amount: {}
    PatchedGoalStatusRequest:
      type: object
      properties:
        status:
          type: string
          minLength: 1
    PatchedTransactionInputRequest:
      type: object
      description: 'Used for POST (all fields required) and PATCH (partial=True: only
        what was sent).'
      properties:
        category_id:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        amount: {}
        transaction_date:
          type: string
          minLength: 1
        note:
          type:
          - string
          - 'null'
    Period:
      type: object
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - end_date
      - start_date
    RecordCounts:
      type: object
      properties:
        transactions:
          type: integer
        budgets:
          type: integer
        goal_contributions:
          type: integer
      required:
      - budgets
      - goal_contributions
      - transactions
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        full_name:
          type: string
          default: ''
          maxLength: 150
      required:
      - email
      - password
    ReportSummaryResponse:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        totals:
          $ref: '#/components/schemas/Totals'
        currency:
          type: string
        granularity:
          type: string
        expense_by_category:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTotal'
        income_by_category:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTotal'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
      required:
      - currency
      - expense_by_category
      - granularity
      - income_by_category
      - period
      - totals
      - trend
    SystemStats:
      type: object
      properties:
        users:
          $ref: '#/components/schemas/UserCounts'
        records:
          $ref: '#/components/schemas/RecordCounts'
        goals_by_status:
          $ref: '#/components/schemas/GoalStatusCounts'
        categories:
          $ref: '#/components/schemas/CategoryCounts'
        generated_at:
          type: string
          format: date-time
      required:
      - categories
      - generated_at
      - goals_by_status
      - records
      - users
    Totals:
      type: object
      properties:
        income_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        expense_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        net_cash_flow:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - expense_total
      - income_total
      - net_cash_flow
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          enum:
          - income
          - expense
          type: string
          description: |-
            * `income` - Income
            * `expense` - Expense
          x-spec-enum-id: 0051e97082791f1b
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        transaction_date:
          type: string
          format: date
          readOnly: true
        note:
          type:
          - string
          - 'null'
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - category
      - created_at
      - id
      - note
      - transaction_date
      - type
    TransactionInputRequest:
      type: object
      description: 'Used for POST (all fields required) and PATCH (partial=True: only
        what was sent).'
      properties:
        category_id:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        amount: {}
        transaction_date:
          type: string
          minLength: 1
        note:
          type:
          - string
          - 'null'
      required:
      - amount
      - category_id
      - transaction_date
      - type
    TrendPoint:
      type: object
      properties:
        period:
          type: string
          format: date
          description: First day of the day/week/month.
        income:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        expense:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        net:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - expense
      - income
      - net
      - period
    User:
      type: object
      description: What the API shows about a user. Never includes the password.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - currency
      - email
      - full_name
      - id
      - role
    UserCounts:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        admins:
          type: integer
        new_last_30_days:
          type: integer
      required:
      - active
      - admins
      - new_last_30_days
      - total
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
tags:
- name: Authentication
  description: Register, sign in, sign out.
- name: Categories
- name: Transactions
- name: Budgets
- name: Savings goals
- name: Dashboard and reports
- name: Administrator
  description: Requires the admin role.
